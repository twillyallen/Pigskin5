name: Refresh NFL stats from nflverse

# nflverse rebuilds its player stats nightly during the season. Once a week
# (Tuesday morning, after Monday Night Football) we pull them into the
# question generator's nfl_data.py. Offseason runs find no changes and exit.
on:
  schedule:
    - cron: "0 12 * * 2" # Tuesdays 12:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/question-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/question-generator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: python update_nfl_data.py --existing generators/nfl_data.py --output generators/nfl_data.py

      - name: Sanity-check generated module
        run: python -c "from generators import nfl_data as d; assert d.QUARTERBACKS and d.DEFENSIVE_PLAYERS and d.FRANCHISES; print(len(d.QUARTERBACKS), 'QBs OK')"

      - name: Commit and push if stats changed
        run: |
          # Ignore the "Generated:" timestamp so offseason runs don't commit
          if git diff --quiet -I '^Generated:' -- generators/nfl_data.py; then
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generators/nfl_data.py
          git commit -m "chore: weekly nflverse stats refresh"
          git pull --rebase
          git push
